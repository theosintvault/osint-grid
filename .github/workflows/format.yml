name: Auto Format

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Prettier
        run: npm install -g prettier

      - name: Run Prettier on JSON, YAML, and Markdown
        run: |
          prettier --write "**/*.json"
          prettier --write "**/*.yml"
          prettier --write "**/*.yaml"
          prettier --write "**/*.md"

      - name: Commit formatted files
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add .
          git diff --cached --quiet || git commit -m "Auto-format files"
