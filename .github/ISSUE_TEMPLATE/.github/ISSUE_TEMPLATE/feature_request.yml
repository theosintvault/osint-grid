name: Feature Request
description: Suggest improvements or new capabilities for The OSINT Grid
title: "[FEATURE] "
labels: ["enhancement"]
body:
  - type: textarea
    id: description
    attributes:
      label: What would you like to see?
      placeholder: Describe the feature or improvement.
    validations:
      required: true

  - type: textarea
    id: use_case
    attributes:
      label: Why is this useful?
      placeholder: Explain the investigative or operational value.

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      placeholder: Any extra details or examples.
